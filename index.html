<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blind Pact</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one long case file. Tape-label header, a ledger-style scoreboard, then the current round as a stack of tear-off contract slips with rubber stamps for outcomes. */
:root{
  --paper:#e6e9e4; --card:#f5f6f1; --ink:#1b2330; --muted:#566170; --rule:#c3c9c1;
  --pen:#22398a; --stamp:#b3302a; --ok:#2c6a48; --gold:#8a6d1f; --sel:#dfe6f7;
  --tape:#1b2330; --tape-text:#f5f6f1;
  --display:'Special Elite','Courier New',monospace;
  --body:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f141a; --card:#18202a; --ink:#e4e9ed; --muted:#93a0ae; --rule:#2c3745;
    --pen:#8fabff; --stamp:#ee6c5e; --ok:#6dc79a; --gold:#d8b75e; --sel:#1f2d4d;
    --tape:#e4e9ed; --tape-text:#18202a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f141a; --card:#18202a; --ink:#e4e9ed; --muted:#93a0ae; --rule:#2c3745;
  --pen:#8fabff; --stamp:#ee6c5e; --ok:#6dc79a; --gold:#d8b75e; --sel:#1f2d4d;
  --tape:#e4e9ed; --tape-text:#18202a; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.7rem)}
h2{font-size:1.4rem}
h3{font-size:1.1rem;margin-top:18px}
h4{font-size:1.15rem}
p{margin:0}
.lead{font-size:1.05rem;max-width:62ch}
.note{color:var(--muted);font-size:.92rem}
.kicker{font:500 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em}
.redact{background:var(--tape);color:var(--tape-text);padding:0 .35em;margin-right:.1em}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.roomtag{font:500 .8rem var(--mono);border:1.5px solid var(--ink);padding:4px 9px;background:var(--card)}
.roomtag b{letter-spacing:.14em}

/* controls */
.btn{font:600 .95rem var(--body);padding:.65rem 1.05rem;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:focus-visible,.slip-btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.small{padding:.35rem .7rem;font-size:.85rem}
.btn.tiny{padding:.15rem .5rem;font-size:.75rem;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{font:500 1rem var(--body);padding:.65rem .8rem;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;width:100%;min-width:0}
label{font:600 .85rem var(--body)}

/* sheets */
.sheet{background:var(--card);border:1.5px solid var(--ink);padding:20px;position:relative;box-shadow:4px 4px 0 var(--rule);display:flex;flex-direction:column;gap:14px}
.hero{gap:16px}
.form{display:grid;gap:14px;max-width:460px}
.field{display:grid;gap:6px}
.joinrow{display:flex;gap:8px}
.joinrow input{text-transform:uppercase;letter-spacing:.2em;font-family:var(--mono)}
.divider{font:500 .75rem var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:2px solid var(--stamp);color:var(--stamp);padding:10px 14px;background:var(--card)}
.banner span{min-width:0}

/* lobby */
.codebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.codelbl{font:500 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.code{font:400 clamp(2rem,9vw,3.2rem) var(--display);letter-spacing:.22em;border:3px solid var(--stamp);color:var(--stamp);padding:2px 16px;transform:rotate(-2deg)}
.roster{list-style:none;margin:0;padding:0;display:grid}
.roster li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--rule);min-width:0}
.roster li:first-child{border-top:0}
.roster .pn{min-width:0;overflow-wrap:anywhere;font-weight:600}
.chip{font:500 .72rem var(--mono);padding:2px 9px;border:1px solid var(--rule);border-radius:99px;color:var(--muted);white-space:nowrap;display:inline-block}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.off{border-style:dashed}
.sigline{color:var(--gold)}
.chip.sig{border-color:var(--gold);color:var(--gold);white-space:normal}
.seg.sig{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.seg.sig button,.seg.sigm button{font:600 .85rem var(--body);padding:.55rem .4rem}
.seg.sigm{grid-template-columns:1fr 1fr}
.sigbox{border-top:1px dashed var(--rule);padding-top:14px;display:grid;gap:10px}
.chip.me{border-color:var(--pen);color:var(--pen)}

/* round bar */
.rbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:8px;border:1.5px solid var(--ink);display:block}
.pips i.done{background:var(--ink)}
.pips i.cur{background:var(--stamp);border-color:var(--stamp)}

/* scoreboard */
.board{border:1.5px solid var(--ink);background:var(--card)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px dashed var(--rule)}
.prow:first-child{border-top:0}
.prow.out{opacity:.55}
.prow .pn{min-width:0;overflow-wrap:anywhere;font-weight:600}
.prow .coins{font:600 1.15rem var(--mono);min-width:3ch;text-align:right}
.delta{font:600 .85rem var(--mono);min-width:3.4ch;text-align:right}
.delta.up{color:var(--ok)} .delta.dn{color:var(--stamp)}
.seals{display:inline-flex;gap:3px;align-items:center;min-width:2ch}
.seals i{width:12px;height:12px;border-radius:50%;background:var(--stamp);display:block;box-shadow:inset 0 0 0 2px var(--card)}

/* contract slips */
.slips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.slip{background:var(--card);border:1.5px solid var(--ink);padding:14px 16px 14px 42px;position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;color:var(--ink)}
.slip::before{content:"";position:absolute;left:13px;top:16px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.slip-btn{font:inherit;cursor:pointer;width:100%}
.slip-btn:hover{background:var(--sel)}
.slip-btn[aria-pressed="true"]{background:var(--sel);outline:3px solid var(--pen);outline-offset:-1px}
.slip.dim{border-style:dashed;opacity:.7}
.slip-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.meta{font:500 .8rem var(--mono);color:var(--muted)}
.tag{font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pen)}
.stamp{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;border:3px solid currentColor;padding:1px 9px;transform:rotate(-5deg);display:inline-block;color:var(--stamp);font-size:.95rem;white-space:nowrap}
.stamp.ok{color:var(--ok)}
.stamp.big{font-size:1.4rem;padding:3px 14px}
.thump .stamp,.stamp.thump{animation:thump .35s ease-out both}

/* dice */
.roll-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dice{display:flex;gap:8px}
.die{width:36px;height:36px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;background:var(--card);border:2px solid var(--ink);border-radius:7px}
.die i{border-radius:50%;display:block}
.die i.on{background:var(--ink)}
.rolling .die{animation:tumble .6s cubic-bezier(.2,.8,.3,1) both}
.rolling .die:nth-child(2){animation-delay:.12s}
.calc{font-size:.9rem;min-width:0;flex:1 1 180px}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.9rem}
.parts li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.parts .coop{color:var(--pen)} .parts .bet{color:var(--stamp)}
.parts b{overflow-wrap:anywhere}
.pay{font-size:.88rem;border-top:1px dashed var(--rule);padding-top:7px;display:grid;gap:2px}

/* action form */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--ink);background:var(--card);padding:12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:2px;border-radius:3px}
.mode strong{font:400 1.15rem var(--display)}
.mode span{font-size:.85rem;color:var(--muted)}
.mode.c{border-color:var(--pen)} .mode.b{border-color:var(--stamp)}
.mode.c[aria-pressed="true"]{background:var(--pen);color:var(--paper)}
.mode.b[aria-pressed="true"]{background:var(--stamp);color:var(--paper)}
.mode[aria-pressed="true"] span{color:inherit;opacity:.9}
.mode:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{font:600 1.1rem var(--mono);padding:.55rem 0;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;border-radius:3px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.seg.n3{grid-template-columns:repeat(3,1fr)}
.seg.n3 button{font-size:.9rem}
.seg.allplayers{grid-template-columns:repeat(7,minmax(0,1fr))}
.seg.allplayers button{font-size:.8rem;padding:.6rem .1rem}
@media(max-width:560px){.seg.allplayers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.practice{border-top:1px dashed var(--rule);padding-top:14px}
.boost{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px dashed var(--gold);color:var(--ink)}
.boost input{margin-top:4px;width:18px;height:18px;accent-color:var(--stamp)}
.sumline{font:500 .9rem var(--mono);color:var(--muted)}
.step{font:500 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ledger */
details{border:1.5px solid var(--ink);background:var(--card)}
summary{cursor:pointer;padding:10px 14px;font:600 .95rem var(--body);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
details > .slips,details > p{margin:0 14px 14px}
.ledger{display:grid;gap:10px}

/* final */
.rank{list-style:none;margin:0;padding:0;display:grid}
.rank li{display:grid;grid-template-columns:2.2ch minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--rule)}
.rank li:first-child{border-top:0}
.rank .n{font:600 1.1rem var(--mono);color:var(--muted)}
.rank .nm{min-width:0;overflow-wrap:anywhere;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rank .coins{font:600 1.3rem var(--mono)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(8,12,16,.65);z-index:50;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--card);border:2px solid var(--ink);max-width:700px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--rule)}
.modal-card ul,.modal-card ol{margin:0;padding-left:1.2rem;display:grid;gap:6px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.odds{display:flex;flex-wrap:wrap;gap:6px}
.odds span{font:500 .8rem var(--mono);border:1px solid var(--rule);padding:3px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;font:500 .85rem var(--mono);z-index:60}


/* choice timer */
.timer{display:grid;gap:6px}
.timer-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#tnum{font:600 1.35rem var(--mono);font-variant-numeric:tabular-nums}
#tnum.low{color:var(--stamp)}
.timer-track{height:10px;border:1.5px solid var(--ink);background:var(--card)}
.timer-bar{height:100%;background:var(--ink);transition:width .25s linear}
.timer-bar.low{background:var(--stamp)}
.recap{margin:0;padding-left:1.2rem;display:grid;gap:5px}
.introbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

@keyframes thump{0%{transform:rotate(-5deg) scale(1.9);opacity:0}70%{transform:rotate(-5deg) scale(.96);opacity:1}100%{transform:rotate(-5deg) scale(1)}}
@keyframes tumble{0%{transform:rotate(-260deg) translateY(-18px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){
  .rolling .die,.thump .stamp,.stamp.thump{animation:none}
  .btn{transition:none}
  .timer-bar{transition:none}
}
@media (max-width:480px){
  .modes{grid-template-columns:1fr}
  .prow{gap:8px;padding:10px}
  .sheet{padding:16px}
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
//#LOGIC-START
const ROUNDS=8, START_COINS=10, INCOME=5;
const CHOICE_SECONDS=45; // time each player gets to choose; the move is sealed automatically at zero
// V12: timer, whole-number coins, non-linear risk bonus. original-backup remains on GitHub.
const BETRAYAL_K=30;
// Risk bonus: riskier contracts pay somewhat more (gently convex, 1.00x up to 1.25x). Most of the
// reward growth already comes from the base reward; this just adds a small premium for risk.
// Tuned with a player-behaviour simulation so every contract keeps getting picked.
const RISK_MULT=[1,1.01,1.04,1.07,1.11,1.15,1.2,1.25];
// Betrayal bounties keep using the contract's base reward so sabotage economics are unchanged.
const baseOf=c=>c.base!=null?c.base:c.reward;
const ROUND_MULTIPLIERS=[1,1,1.1,1.1,1.2,1.2,1.3,1.4];
const roundMultiplier=r=>ROUND_MULTIPLIERS[Math.max(0,Math.min(ROUNDS-1,r-1))];
// Each contract keeps its reward and distinct risk. Difficulty is calculated afresh
// from active player count and number of available contracts, not fixed lobby bands.
const TIERS=[
  {name:'Dead Drop',reward:10,risk:0},
  {name:"Smuggler's Run",reward:15,risk:2},
  {name:'Casino Floor',reward:23,risk:5},
  {name:'Vault Job',reward:32,risk:7}
];
const EXTRA_TIERS=[
  {name:'Night Courier',reward:12,risk:1},
  {name:'Black Market',reward:19,risk:4},
  {name:'Harbor Exchange',reward:16,risk:3},
  {name:'Diamond Heist',reward:27,risk:6}
];
function contractCount(n){return n>=12?6:n>=10?5:n>=8?4:3;}

const sum=a=>a.reduce((x,y)=>x+y,0);
const rnd=n=>Math.floor(Math.random()*n);

function sha256(ascii){
  const rrot=(v,a)=>(v>>>a)|(v<<(32-a));
  const mp=Math.pow, mw=mp(2,32);
  let result='', words=[], bitLen=ascii.length*8, hash=[], k=[], pc=0;
  const comp={};
  for(let c=2;pc<64;c++){
    if(!comp[c]){
      for(let i=0;i<313;i+=c) comp[i]=c;
      hash[pc]=(mp(c,.5)*mw)|0;
      k[pc++]=(mp(c,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(let i=0;i<ascii.length;i++){
    const j=ascii.charCodeAt(i);
    if(j>>8) return '';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=((bitLen/mw)|0);
  words[words.length]=bitLen;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16), old=hash;
    hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1=hash[7]+(rrot(e,6)^rrot(e,11)^rrot(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rrot(w15,7)^rrot(w15,18)^(w15>>>3))+w[i-7]+(rrot(w2,17)^rrot(w2,19)^(w2>>>10)))|0);
      const t2=(rrot(a,2)^rrot(a,13)^rrot(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16);}
  return result;
}

const canon=(code,r,u,rv)=>`${code}|${r}|${u}|${rv.contract}|${rv.mode}|${rv.energy}|${rv.boost}|${rv.salt}`;
function validReveal(rv){
  return !!rv && Number.isInteger(rv.contract) && rv.contract>=0 && rv.contract<8
    && (rv.mode==='C'||rv.mode==='B')
    && Number.isInteger(rv.energy) && rv.energy>=1 && rv.energy<=5
    && (rv.boost===0||rv.boost===1)
    && typeof rv.salt==='string' && /^[0-9a-f]{8,32}$/.test(rv.salt);
}
function adaptiveDifficulty(n,c,risk){
  // 7 is the average two-dice roll; 3 is a typical cooperating energy spend.
  // Only 60% of the other players' evenly distributed expected contribution is counted.
  // Risk only adds 0.7 difficulty per level, so the hardest contract stays within reach of a coordinated table.
  return Math.round(7+3*(1+0.6*(n-1)/c)+0.7*risk);
}
function genContracts(n=6){
  const count=contractCount(n);
  const pool=TIERS.concat(EXTRA_TIERS).sort((a,b)=>a.risk-b.risk);
  // Always offer an approachable contract, plus a spread of increasingly risky jobs.
  // Rotate which job appears within each risk range across rounds.
  const selected=[];
  for(let i=0;i<count;i++){
    const low=Math.floor(i*pool.length/count);
    const high=Math.floor((i+1)*pool.length/count)-1;
    selected.push(pool[low+rnd(high-low+1)]);
  }
  const list=selected.map(t=>{
    const base=t.reward+rnd(3)-1, mult=RISK_MULT[t.risk]||1;
    return {name:t.name,base,mult,reward:Math.round(base*mult),
      diff:Math.max(8,adaptiveDifficulty(n,count,t.risk)+rnd(3)-1)};
  });
  // 'selected' is in rising-risk order. Random jitter must never let a riskier contract be as easy
  // as (or easier than) a safer one, otherwise it would simply be the better choice.
  list.forEach((c,i)=>{ if(i>0){ if(c.diff<=list[i-1].diff) c.diff=list[i-1].diff+1; if(c.reward<=list[i-1].reward) c.reward=list[i-1].reward+1; } });
  return list;
}
// 'Contributions' means effective cooperative energy (including seal boosts).
// Full bounty for decisive sabotage; small capped disruption reward for other failed jobs with cooperators.
function betrayalPayout(contractReward,coopEnergy,round,betEnergy=0){
  // V14: the bounty depends on three things: your own energy (refunded in full when your sabotage is
  // decisive), the contract's base reward, and the cooperating energy you destroyed. It is a POOL
  // shared by all decisive betrayers in proportion to their energy.
  return Math.max(1,betEnergy+Math.round((0.3*contractReward+0.4*coopEnergy)*roundMultiplier(round)));
}
function disruptionPayout(contractReward,coopEnergy,round,betEnergy=0){
  // The job was going to fail anyway: half of the betrayers' energy comes back, plus a small share of
  // the reward and of the cooperating energy wasted. Shared among betrayers by energy.
  return Math.max(1,Math.round(0.5*betEnergy+roundMultiplier(round)*(0.2*coopEnergy+0.1*contractReward)));
}
function activeAt(g,r){ const k=g.kicked||{}; return (g.order||[]).filter(u=>!(k[u]&&k[u]<=r)); }
function phaseOf(g,r,mv){
  const act=activeAt(g,r);
  if(act.some(u=>!(mv[r+'-'+u]&&mv[r+'-'+u].commit))) return 'choose';
  if(act.some(u=>!mv[r+'-'+u].reveal)) return 'reveal';
  return 'results';
}
function split(pool,coop,tieSeed){
  // Whole-coin split in proportion to effective energy (largest remainder).
  // Leftover coins go to the biggest remainders; exact ties are broken by a hash of the shared
  // game seed, so equal contributions are treated fairly and every browser gets the same answer.
  const tot=sum(coop.map(p=>p.eff));
  if(!tot||pool<=0) return {};
  const parts=coop.map(p=>{
    const exact=pool*p.eff/tot, whole=Math.floor(exact+1e-9);
    return {uid:p.uid,whole,frac:exact-whole,tie:parseInt(sha256(tieSeed+'|'+p.uid).substr(0,8),16)};
  });
  let left=pool-sum(parts.map(b=>b.whole));
  parts.slice().sort((a,b)=>(b.frac-a.frac)||(a.tie-b.tie)).forEach(b=>{if(left>0){b.whole++;left--;}});
  const pay={}; parts.forEach(b=>{pay[b.uid]=b.whole;}); return pay;
}
function resolveRound(g,r,act,mv,coins,tokens){
  const contracts=g['contracts_'+r]||[];
  const voided=[], valid=[], dC={}, dT={};
  act.forEach(u=>{dC[u]=0;dT[u]=0;});
  act.forEach(u=>{
    const m=mv[r+'-'+u], rv=m&&m.reveal;
    if(validReveal(rv) && sha256(canon(g.code,r,u,rv))===m.commit){
      let boost=rv.boost; if(boost&&(tokens[u]||0)<2) boost=0;
      valid.push({uid:u,contract:rv.contract,mode:rv.mode,energy:rv.energy,boost,eff:rv.energy+(boost?3:0)});
    } else voided.push(u);
  });
  valid.forEach(p=>{
    coins[p.uid]-=p.energy; dC[p.uid]-=p.energy;
    if(p.boost){tokens[p.uid]-=2; dT[p.uid]-=2;}
  });
  const salts=act.map(u=>{const m=mv[r+'-'+u];return (m&&m.reveal&&typeof m.reveal.salt==='string')?m.reveal.salt:'-';}).join(',');
  const seed=sha256(g.seed+'|'+r+'|'+salts);
  const out=contracts.map((c,i)=>{
    const parts=valid.filter(p=>p.contract===i);
    if(!parts.length) return {i,c,parts:[],empty:true};
    const coop=parts.filter(p=>p.mode==='C'), bet=parts.filter(p=>p.mode==='B');
    const d1=parseInt(seed.substr(i*8,4),16)%6+1, d2=parseInt(seed.substr(i*8+4,4),16)%6+1;
    const coopE=sum(coop.map(p=>p.eff)), betE=sum(bet.map(p=>p.eff));
    const need=c.diff+betE, total=coopE+d1+d2;
    const success=coop.length>0 && total>=need;
    const wouldHave=coop.length>0 && total>=c.diff;
    let pay={}, seals=[];
    if(success) pay=split(Math.round(c.reward*roundMultiplier(r)),coop,seed+'|'+i);
    else if(bet.length && coop.length){
      const decisive=wouldHave;
      const betReal=sum(bet.map(p=>p.energy));
      const bounty=decisive?betrayalPayout(baseOf(c),coopE,r,betReal):disruptionPayout(baseOf(c),coopE,r,betReal);
      // Only decisive sabotage earns reputation seals.
      // The bounty is a shared pool split among betrayers by effective energy (not paid in full to each).
      pay=split(bounty,bet.map(p=>({uid:p.uid,eff:p.eff})),seed+'|b'+i);
      if(decisive) bet.forEach(p=>seals.push(p.uid));
    }
    Object.keys(pay).forEach(u=>{coins[u]+=pay[u]; dC[u]+=pay[u];});
    seals.forEach(u=>{tokens[u]+=1; dT[u]+=1;});
    return {i,c,parts,d1,d2,coopE,betE,need,total,success,pay,seals,coopN:coop.length};
  });
  return {out,voided,dC,dT};
}
function computeState(g,mv){
  const order=g.order||[], R=g.round||0, coins={}, tokens={}, rounds=[];
  order.forEach(u=>{coins[u]=START_COINS;tokens[u]=0;});
  for(let r=1;r<=R;r++){
    const act=activeAt(g,r);
    act.forEach(u=>{coins[u]+=INCOME;});
    const ph=phaseOf(g,r,mv);
    if(ph!=='results'){rounds.push({r,phase:ph,resolved:false,active:act}); break;}
    const res=resolveRound(g,r,act,mv,coins,tokens);
    rounds.push({r,phase:'results',resolved:true,active:act,out:res.out,voided:res.voided,deltaCoins:res.dC,deltaTokens:res.dT});
  }
  return {rounds,coins,tokens};
}

/* ----- practice mode: an in-memory table with bots ----- */
function makeFakeDb(){
  const store={}, subs=new Set();
  const clone=x=>JSON.parse(JSON.stringify(x));
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const merge=(a,b)=>{for(const k in b){if(isObj(b[k])&&isObj(a[k])) merge(a[k],b[k]); else a[k]=clone(b[k]);}};
  const meta={fromCache:false,hasPendingWrites:false};
  const dsnap=p=>({id:p.split('/').pop(),exists:p in store,data:()=>(p in store?clone(store[p]):undefined),metadata:meta});
  const qsnap=(col,wh)=>{
    const docs=Object.keys(store).filter(p=>p.split('/')[0]===col&&wh.every(w=>store[p][w[0]]===w[2])).sort().map(dsnap);
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta};
  };
  const later=fn=>setTimeout(fn,0);
  const notify=()=>subs.forEach(s=>later(()=>{if(subs.has(s)) s.fire();}));
  const listen=fire=>{const s={fire};subs.add(s);later(()=>{if(subs.has(s)) s.fire();});return ()=>subs.delete(s);};
  const query=(col,wh)=>({
    where:(f,o,v)=>query(col,wh.concat([[f,o,v]])),
    get:async()=>qsnap(col,wh),
    onSnapshot:next=>listen(()=>next(qsnap(col,wh)))
  });
  const docRef=p=>({
    id:p.split('/').pop(),path:p,
    get:async()=>dsnap(p),
    set:async(d,o)=>{if(o&&o.merge&&p in store) merge(store[p],d); else store[p]=clone(d); notify();},
    update:async d=>{if(!(p in store)) throw {code:'invalid_argument'}; merge(store[p],d); notify();},
    delete:async()=>{delete store[p];notify();},
    onSnapshot:next=>listen(()=>next(dsnap(p)))

const BOT_NAMES=['Ravi','Meera','Kabir','Zoya','Arjun','Isha','Dev','Tara','Nikhil','Anaya','Rohan','Sana','Vihaan','Maya'];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

// Probability-aware practice bots. They use prior public results, never hidden moves.
function diceChance(minimum){
  let hits=0;
  for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b>=minimum)hits++;
  return hits/36;

function botMove(u){
  const style=botStyle[u]||'wild',r=game.round,tok=st.tokens[u]||0;
  const contracts=game['contracts_'+r]||[];
  const active=activeAt(game,r).length;
  const coins=st.coins[u]||0;
  const history=st.rounds.slice(0,Math.max(0,r-1));
  const options=[];
  for(let i=0;i<contracts.length;i++){
    const c=contracts[i];
    // Learn which contract names were popular in earlier rounds.
    let pastVisits=0,pastRounds=0,pastBetrays=0,pastMoves=0;
    history.forEach(rr=>(rr.out||[]).forEach(o=>{
      if(o.c&&o.c.name===c.name&&!o.empty){
        pastRounds++;pastVisits+=o.parts.length;
        o.parts.forEach(p=>{pastMoves++;if(p.mode==='B')pastBetrays++;});
      }
    }));
    const popularity=pastRounds?pastVisits/pastRounds:Math.max(0.4,(active-1)/contracts.length);
    const otherPlayers=Math.max(0,Math.min(active-1,popularity));
    const observedBetray=pastMoves?pastBetrays/pastMoves:0.22;
    const trust=Math.max(.15,Math.min(.9,1-observedBetray));
    const coopExpected=otherPlayers*trust*3.5;
    const sabotageExpected=otherPlayers*(1-trust)*2.5;
    const coopCount=1+otherPlayers*trust;
    for(let energy=1;energy<=Math.min(5,Math.max(1,coins));energy++){
      const pFund=diceChance(c.diff+sabotageExpected-coopExpected-energy);
      const coopShare=Math.round(c.reward*roundMultiplier(r)*energy/Math.max(energy,energy+coopExpected));
      let coopEV=pFund*coopShare-energy;
      // Cooperation also matters for reputation and keeping the game alive.
      if(style==='steady')coopEV+=1.5;
      if(style==='grudge')coopEV+=0.6;
      options.push({contract:i,mode:'C',energy,score:coopEV});
      if(otherPlayers>0.15){
        const without=diceChance(c.diff-coopExpected);
        const withSab=diceChance(c.diff+energy-coopExpected);
        const decisive=Math.max(0,without-withSab);
        const bounty=betrayalPayout(baseOf(c),coopExpected,r,energy);
        const failWithSab=1-withSab;
        const small=disruptionPayout(baseOf(c),coopExpected,r,energy);
        let betEV=decisive*bounty+Math.max(0,failWithSab-decisive)*small-energy;
        if(style==='shark')betEV+=1.6;
        if(style==='steady')betEV-=1.5;
        if(style==='grudge'){
          const hurt=history.slice(-1).some(rr=>(rr.out||[]).some(o=>!o.empty&&!o.success&&o.betE>0&&o.parts.some(p=>p.uid===u&&p.mode==='C')));
          if(hurt)betEV+=2;
        }
        options.push({contract:i,mode:'B',energy,score:betEV});
      }
    }
  }
  // Softmax choice keeps opponents imperfect and avoids one fixed strategy.
  const temp=style==='wild'?3.0:style==='shark'?2.1:1.7;
  const top=Math.max(...options.map(x=>x.score));
  const weights=options.map(x=>Math.exp(Math.max(-30,(x.score-top)/temp)));
  let roll=Math.random()*sum(weights),pick=options[options.length-1];
  for(let j=0;j<options.length;j++){roll-=weights[j];if(roll<=0){pick=options[j];break;}}
  // Boost is saved for promising moves instead of spent randomly.
  const boost=tok>=2&&pick.energy>=3&&rnd(100)<25?1:0;
  return {contract:pick.contract,mode:pick.mode,energy:pick.energy,boost,salt:randHex(16)};
}
function botsTick(){
  if(!practice||!game||game.status!=='playing'||!st) return;
  const d=db, c=code, r=game.round, ph=phaseOf(game,r,moves), act=activeAt(game,r);
  game.order.forEach(u=>{
    if(u.indexOf('bot_')!==0||!act.includes(u)) return;
    const key=c+':'+r+':'+u, m=moves[r+'-'+u];
    if(ph==='choose'&&!m&&!botDone[key+'s']){
      // Bots signal first (some mostly honest, some bluffing), then wait for everyone before sealing.
      botDone[key+'s']=1;
      const rv=botMove(u); botPending[key]=rv;
      const sty=botStyle[u]||'wild', cl=game['contracts_'+r]||[];
      const backing=rv.mode==='C';
      let sg=null;
      if(backing&&rnd(100)<(sty==='steady'?85:60)) sg={c:rv.contract};
      else if(!backing&&rnd(100)<(sty==='shark'?65:35)) sg={c:rnd(Math.max(1,cl.length))};
      const data={code:c,uid:u,['sigdone_'+r]:true}; if(sg) data['sig_'+r]=sg;

    }

      botBusy[key]=1;
      const rv=botPending[key];
      const commit=sha256(canon(c,r,u,rv));
      setTimeout(()=>{if(practice&&code===c) d.doc(mid(c,r,u)).set({code:c,round:r,uid:u,commit,sealedAt:Date.now()});},500+rnd(1600));
    }
    if(ph==='reveal'&&m&&!m.reveal&&botPending[key]&&!botDone[key]){
      botDone[key]=1;
      setTimeout(()=>{if(practice&&code===c) d.doc(mid(c,r,u)).update({reveal:botPending[key]});},300+rnd(800));
    }
  });
}

}
function slipResult(o,fresh){
  if(o.empty) return `<article class="slip dim"><h4>${esc(o.c.name)}</h4><span class="meta">Reward ${o.c.reward} &middot; Difficulty ${o.c.diff} &middot; Round multiplier ${roundMultiplier(st.rounds.find(rr=>rr.out&&rr.out.includes(o))?.r||game.round).toFixed(1)}×</span><p class="note">Nobody took this contract.</p></article>`;
  const calc=o.coopN===0?'Nobody cooperated, so nothing could succeed.'
    :`Cooperating energy ${o.coopE} + dice ${o.d1+o.d2} = <b>${o.total}</b>. Needed <b>${o.need}</b>${o.betE?` (${o.c.diff} + ${o.betE} sabotage)`:''}.`;
  const rn=st.rounds.find(rr=>rr.out&&rr.out.includes(o))?.r||game.round;
  const parts=o.parts.map(p=>{const sg=sigOf(p.uid,rn); return `<li class="${p.mode==='C'?'coop':'bet'}"><b>${nm(p.uid)}</b> ${p.mode==='C'?'cooperated':'betrayed'} with ${p.energy}${p.boost?' +3':''}${sg?` <span class="note">(signalled ${sigText(sg,rn)})</span>`:''}</li>`;}).join('');
  const pay=Object.keys(o.pay).filter(u=>o.pay[u]>0).map(u=>`<span><b>${nm(u)}</b> earns ${o.pay[u]}</span>`).join('');
  const sl=o.seals.map(u=>`<span><b>${nm(u)}</b> gains a seal</span>`).join('');
  const none=!pay&&!sl?'<span class="note">No payout.</span>':'';
  return `<article class="slip${fresh?' thump':''}"><div class="slip-h"><h4>${esc(o.c.name)}</h4><span class="stamp ${o.success?'ok':''}">${o.success?'Funded':'Collapsed'}</span></div>
    <span class="meta">Reward ${o.c.reward} &middot; Difficulty ${o.c.diff} &middot; Round multiplier ${roundMultiplier(st.rounds.find(rr=>rr.out&&rr.out.includes(o))?.r||game.round).toFixed(1)}×</span>
    <div class="roll-row${fresh?' rolling':''}"><div class="dice">${die(o.d1)}${die(o.d2)}</div><p class="calc">${calc}</p></div>
    <ul class="parts">${parts}</ul><div class="pay">${pay}${sl}${none}</div></article>`;
}
function roundHTML(rr,fresh){
  const v=rr.voided.length?`<p class="note">No valid move this round from ${rr.voided.map(nm).join(', ')}.</p>`:'';
  return `<div class="slips">${rr.out.map(o=>slipResult(o,fresh)).join('')}</div>${v}`;
}
function resultsPanel(cur,host){
  const R=game.round, t=seen[R]||(seen[R]=Date.now()+1600), fresh=Date.now()<t;
  const last=R>=ROUNDS;
  const can=host||ui.late===R;
  return `<section class="sheet"><h2>What happened</h2>${roundHTML(cur,fresh)}
    <div>${can?`<button class="btn primary" data-act="next"${ui.busy?' disabled':''}>${last?'See final standings':'Start round '+(R+1)}</button>`:`<p class="note">Waiting for the host to start the next round.</p>`}</div></section>`;
}
function ledger(done){
  const R=game.round;
  const list=st.rounds.filter(x=>x.resolved&&(done||x.r<R)).reverse();
  if(!list.length) return '';
  const items=list.map(x=>{
    const f=x.out.filter(o=>!o.empty&&o.success).length, c=x.out.filter(o=>!o.empty&&!o.success).length;
    const open=ui.open[x.r]!==undefined?ui.open[x.r]:(done&&x.r===R);
    return `<details data-r="${x.r}"${open?' open':''}><summary><span>Round ${x.r}</span><span class="note">${f} funded &middot; ${c} collapsed</span></summary>${roundHTML(x,false)}</details>`;
  }).join('');
  return `<section class="ledger" aria-label="Ledger"><h3>Ledger</h3>${items}</section>`;
}
function finalHTML(){
  const k=game.kicked||{};
  const ranked=game.order.filter(u=>!k[u]).sort((a,b)=>st.coins[b]-st.coins[a]);
  const out=game.order.filter(u=>k[u]);
  const top=ranked.length?st.coins[ranked[0]]:0;
  const winners=ranked.filter(u=>st.coins[u]===top);
  let rank=0,prev=null;
  const rows=ranked.map((u,i)=>{
    if(st.coins[u]!==prev){rank=i+1;prev=st.coins[u];}
    return `<li><span class="n">${rank}</span><span class="nm">${nm(u)}${u===uid?' <span class="chip me">you</span>':''}${winners.includes(u)?`<span class="stamp ok thump">${winners.length>1?'Shared win':'Winner'}</span>`:''}</span><span class="coins">${st.coins[u]}</span></li>`;
  }).join('');
  return `<section class="sheet"><p class="kicker">After ${ROUNDS} rounds</p><h2>Final standings</h2>
    <ol class="rank">${rows}</ol>
    ${out.length?`<p class="note">Removed during play: ${out.map(nm).join(', ')}</p>`:''}
    ${winners.length>1?'<p class="note">Tied on coins, so the win is shared.</p>':''}
    <div><button class="btn primary" data-act="home">Back to start</button></div></section>`;
}

/* ----- rules ----- */
function rulesHTML(){
  return `<div class="modal-card"><div class="modal-head"><h2>Rules</h2><button class="btn small" data-close="1" id="closeRules">Close</button></div>
  <p class="lead">Eight rounds. Back a contract in secret, then help it or sink it. Most coins after round 8 wins.</p>
  <h3>Each round</h3><ol>
    <li>You get 5 coins (everyone starts with 10).</li>
    <li>Secretly pick a contract. Riskier ones pay far more, and others can pick the same one.</li>
    <li>Choose <b>Cooperate</b> or <b>Betray</b> and invest 1 to 5 energy. Each energy costs 1 coin. You have ${CHOICE_SECONDS} seconds.</li>
    <li>All choices open together and dice are rolled.</li></ol>
  <h3>How a contract is resolved</h3><ol>
    <li>Everyone's energy is paid in coins, whatever happens. A seal boost adds +3 <b>effective</b> energy for free.</li>
    <li>Two dice are rolled for each contract that was picked (total 2 to 12).</li>
    <li><b>Cooperating total</b> = cooperators' effective energy + the dice. <b>Needed</b> = the contract's difficulty + betrayers' effective energy.</li>
    <li>The contract is <b>funded</b> if at least one player cooperated and the cooperating total is at least the needed number. Otherwise it <b>collapses</b>.</li></ol>
  <h3>Reward calculations</h3><ul>
    <li><b>Funded:</b> the pool is the contract's reward &times; the round multiplier (1.0, 1.0, 1.1, 1.1, 1.2, 1.2, 1.3, 1.4 for rounds 1 to 8), rounded to a whole number. Cooperators share it in proportion to their effective energy, in whole coins (leftover coins go to the biggest remainders, exact ties are settled fairly by the game's shared seed). Betrayers get nothing.</li>
    <li><b>Collapsed, decisive sabotage:</b> the cooperators would have beaten the contract's difficulty if nobody had betrayed. The betrayers share a pool of <b>their own real energy back</b> + (0.3 &times; the contract's base reward + 0.4 &times; the cooperators' effective energy) &times; the round multiplier, minimum 1. Split by effective energy. Each decisive betrayer also earns 1 reputation seal.</li>
    <li><b>Collapsed, not decisive:</b> the contract was going to fail anyway. The betrayers share a pool of 0.5 &times; their own real energy + (0.2 &times; the cooperators' effective energy + 0.1 &times; the base reward) &times; the round multiplier, minimum 1. Split by effective energy. No seals.</li>
    <li><b>Collapsed with nobody cooperating, or nobody betraying:</b> no one is paid and the energy spent is lost.</li>
    <li>The <b>base reward</b> is the contract's reward before its risk bonus, so riskier contracts do not make sabotage pay more. Contracts nobody picked do nothing.</li></ul>
  <h3>Outcomes</h3><ul>
    <li><b>Funded:</b> cooperators share the reward by how much they put in. Betrayers get nothing.</li>
    <li><b>Sabotaged:</b> if your betrayal is what makes a contract fail, your energy is refunded and you also share a bonus (based on the contract's reward and the cooperators' energy you wasted) with any other saboteurs, split by energy, and you earn a reputation seal. Disrupting a contract that was failing anyway returns about half your energy plus a small share.</li>
    <li><b>Seals:</b> spend 2 seals for +3 free energy on one move.</li>
    <li><b>Signals:</b> before sealing there is a short signal step (${SIGNAL_SECONDS} seconds). You may name a contract you say you are backing, or skip. Signals are shown to everyone at once, then sealing opens. A signal is not binding, so you can bluff. Results list each player's signal next to what they actually did.</li>
    <li>Rewards grow as the rounds go on. All points are whole numbers, and ties share the win.</li></ul>
  <p class="note">Moves are locked with a fingerprint before anyone sees them, so nobody can peek or change theirs, and nobody controls the dice.</p></div>`;
}
let lastFocus=null;
function openRules(){
  const m=$('#modal'); m.innerHTML=rulesHTML(); m.hidden=false; lastFocus=document.activeElement;
  const c=$('#closeRules'); if(c) c.focus();
}
const INTRO=[
  {h:'The goal',p:'Play 8 rounds. Every round you earn 5 coins and spend some on contracts. Whoever holds the most coins after round 8 wins.'},
  {h:'Pick a contract',p:'Each round offers a few contracts. Harder ones pay much more but are less likely to work. You choose in secret, and other players can pick the same one.'},
  {h:'Help it or sink it',p:'Cooperate to push your contract toward success and share the reward. Betray to make it harder, and earn a bounty if your sabotage is what makes it fail. The energy you invest costs coins either way.'},
  {h:'The reveal',p:'Everyone\u2019s choices open at the same time, and dice add a little luck. Successful sabotage earns reputation seals you can spend on a boost. You get ${CHOICE_SECONDS} seconds to decide each round.'}
];
let introStep=0;
function paintIntro(){
  const s=INTRO[introStep], last=introStep===INTRO.length-1;
  let pips=''; for(let i=0;i<INTRO.length;i++) pips+=`<i class="${i<=introStep?'done':''}"></i>`;
  $('#modal').innerHTML=`<div class="modal-card"><div class="modal-head"><p class="kicker">How to play &middot; ${introStep+1} of ${INTRO.length}</p><button class="btn small" data-close="1">Skip</button></div>
    <h2>${s.h}</h2><p class="lead">${s.p.replace('${CHOICE_SECONDS}',CHOICE_SECONDS)}</p>
    <div class="pips" role="img" aria-label="Step ${introStep+1} of ${INTRO.length}">${pips}</div>
    <div class="introbtns">${introStep>0?'<button class="btn" data-intro="back">Back</button>':''}<button class="btn primary" id="introNext" data-intro="next">${last?'Got it, let\u2019s play':'Next'}</button>${last?'<button class="btn small" data-intro="rules">Full rules</button>':''}</div></div>`;
  const n=$('#introNext'); if(n) n.focus();
}
function openIntro(){
  ls.set('bp:intro','1'); introStep=0; lastFocus=document.activeElement;
  $('#modal').hidden=false; paintIntro();
}
function closeRules(){const m=$('#modal'); m.hidden=true; m.innerHTML=''; if(lastFocus&&lastFocus.focus) lastFocus.focus();}
$('#modal').addEventListener('click',e=>{
  const ib=e.target.closest('[data-intro]');
  if(ib){
    const a=ib.dataset.intro;
    if(a==='next'){if(introStep>=INTRO.length-1) closeRules(); else {introStep++;paintIntro();}}
    else if(a==='back'){introStep=Math.max(0,introStep-1);paintIntro();}
    else if(a==='rules'){openRules();}
    return;
  }
  if(e.target.id==='modal'||e.target.closest('[data-close]')) closeRules();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden) closeRules();});
